name: CI

env:
  JACOCO_VERSION: "0.8.15"

on:
  pull_request:      # no `branches:` filter → runs for a PR targeting ANY branch
  push:               # no `branches:` filter → runs for a push to ANY branch

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-folders.outputs.folders }}
      has_changes: ${{ steps.set-folders.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to diff against base branch

      - name: Determine changed top-level folders
        id: set-folders
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Fallback for first push to a new branch (before = all zeros)
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Diffing $BASE_SHA..$HEAD_SHA"

          # List changed files, take the first path segment (top-level folder),
          # drop files sitting at repo root, dedupe.
          # `|| true` at the end matters: if grep -v filters out every line
          # (e.g. this push only touched files under .github/), grep exits 1,
          # and under `set -euo pipefail` that would kill the script right
          # here — before we even reach the "no folders changed" handling
          # below. `|| true` lets that case fall through as an empty $FOLDERS
          # instead of aborting the job.
          FOLDERS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -v '^\.github/' \
            | awk -F/ 'NF>1 {print $1}' \
            | sort -u || true)

          if [ -z "$FOLDERS" ]; then
            echo "folders=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON=$(printf '%s\n' "$FOLDERS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "folders=$JSON" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Changed folders: $JSON"

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.detect-changes.outputs.folders) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Skip if folder no longer exists (e.g. was deleted/renamed)
        id: check
        run: |
          if [ -d "${{ matrix.folder }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache JaCoCo
        if: steps.check.outputs.exists == 'true'
        id: cache-jacoco
        uses: actions/cache@v4
        with:
          path: ~/jacoco
          key: jacoco-${{ env.JACOCO_VERSION }}

      - name: Download JaCoCo
        if: steps.check.outputs.exists == 'true' && steps.cache-jacoco.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/jacoco
          curl -fsSL -o /tmp/jacoco.zip \
            "https://github.com/jacoco/jacoco/releases/download/v${JACOCO_VERSION}/jacoco-${JACOCO_VERSION}.zip"
          unzip -q /tmp/jacoco.zip -d ~/jacoco

      - name: Compile ${{ matrix.folder }}
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.folder }}
        run: |
          mkdir -p out
          find . -name '*.java' > sources.txt
          if [ -s sources.txt ]; then
            javac -d out @sources.txt
          else
            echo "No .java files found in ${{ matrix.folder }}, skipping compile."
          fi

      - name: Run tests and measure coverage (Main is never executed)
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.folder }}
        run: |
          set -uo pipefail

          JACOCO_AGENT="$HOME/jacoco/lib/jacocoagent.jar"
          JACOCO_CLI="$HOME/jacoco/lib/jacococli.jar"

          # No package declarations in these files, so javac -d out flattens
          # everything (Main.class, TribonacciMemo.class, *Test.class) into out/.
          # We only run classes whose name ends in "Test" — Main.class is
          # intentionally excluded by this naming filter.
          TEST_CLASSES=$(find out -maxdepth 1 -name '*Test.class' 2>/dev/null \
            | sed 's|^out/||; s|\.class$||')

          if [ -z "$TEST_CLASSES" ]; then
            echo "No test classes found under ${{ matrix.folder }}/test — nothing to run."
            echo "## Coverage — \`${{ matrix.folder }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "_No test classes found — nothing to measure._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          rm -f jacoco.exec
          FAILED=0
          for CLASS in $TEST_CLASSES; do
            echo "::group::Running $CLASS"
            # Each run appends to the same jacoco.exec so coverage accumulates
            # across every test class in this folder.
            if ! java -javaagent:"$JACOCO_AGENT"=destfile=jacoco.exec,append=true -cp out "$CLASS"; then
              FAILED=1
            fi
            echo "::endgroup::"
          done

          # Coverage is measured against everything EXCEPT Main.class, per request.
          # Note: this still includes the *Test classes themselves in the measured
          # set — say the word if you'd also like those excluded from the numbers.
          mkdir -p coverage-classes
          find out -maxdepth 1 -name '*.class' ! -name 'Main.class' -exec cp {} coverage-classes/ \;

          echo "## Coverage — \`${{ matrix.folder }}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ -f jacoco.exec ] && [ -n "$(ls -A coverage-classes 2>/dev/null)" ]; then
            java -jar "$JACOCO_CLI" report jacoco.exec \
              --classfiles coverage-classes \
              --sourcefiles . \
              --sourcefiles test \
              --xml jacoco.xml \
              --csv jacoco.csv \
              --html coverage-html \
              || echo "_JaCoCo report generation failed — see raw logs above._" >> "$GITHUB_STEP_SUMMARY"

            if [ -f jacoco.csv ]; then
              {
                echo ""
                echo "| Class | Line Coverage |"
                echo "|---|---|"
                awk -F, 'NR>1 {
                  total=$8+$9;
                  pct = (total>0) ? ($9/total)*100 : 0;
                  printf "| %s | %.1f%% (%d/%d lines) |\n", $3, pct, $9, total
                }' jacoco.csv

                TOTAL_PCT=$(awk -F, 'NR>1 {lm+=$8; lc+=$9} END {
                  total=lm+lc;
                  if (total>0) printf "%.1f", (lc/total)*100; else printf "0.0"
                }' jacoco.csv)
                echo ""
                echo "**Overall line coverage: ${TOTAL_PCT}%** (\`Main.java\` excluded)"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "_No coverage data recorded (no non-Main classes to measure)._" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ One or more test classes failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload coverage HTML report
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.folder }}
          path: ${{ matrix.folder }}/coverage-html
          if-no-files-found: ignore
          retention-days: 14